[project]
name = "chgk"
version = "0.1.0"
description = "Answer cards with QR codes and jury scanning for in-person sport ЧГК"
authors = [
    { name = "Anton Menshov", email = "anton.menshov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "reportlab>=5.1.0",
    "segno>=1.6.6",
    "typer>=0.27.3",
]

[project.scripts]
chgk = "chgk.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pypdf>=6.21.4",
    "pypdfium2>=5.14.0",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "zxing-cpp>=3.1.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
# Google Python style where a linter can check it (naming, imports, Google-convention
# docstrings), plus pyflakes/pycodestyle, likely bugs and modernisation.
select = ["E", "W", "F", "I", "N", "D", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "D1",       # a docstring on every function: Google asks for them where not obvious
    "RUF001",   # Russian text is not "ambiguous Unicode"
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["chgk"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]  # typer's way of declaring CLI parameters
