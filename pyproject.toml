[project]
name = "chgk"
version = "0.1.0"
description = "Answer cards with QR codes and jury scanning for in-person sport ЧГК"
authors = [
    { name = "Anton Menshov", email = "anton.menshov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "reportlab>=5.1.0",
    "segno>=1.6.6",
    "typer>=0.27.3",
]

[project.scripts]
chgk = "chgk.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pypdf>=6.21.4",
    "pypdfium2>=5.14.0",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "zxing-cpp>=3.1.1",
]
