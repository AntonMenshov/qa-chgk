<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ЧГК · табло</title>
    <link rel="icon" href="../s/icons/icon-192.png" />
    <link rel="stylesheet" href="board.css" />
    <script defer src="vendor/qrcode-generator-1.4.4/qrcode.js"></script>
    <script type="module" src="board.js"></script>
  </head>
  <body>
    <main id="stage">
      <noscript>Табло работает только с включённым JavaScript.</noscript>
    </main>
    <div id="status" class="status" role="status" hidden></div>
    <nav id="controls" class="controls">
      <button id="prev" aria-label="Скрыть последний тур" disabled title="← скрыть последний тур">‹</button>
      <button id="next" disabled title="→ или пробел: показать следующий тур">Загрузка…</button>
      <button id="view" disabled title="G: сетка / кратко">Сетка</button>
      <button id="qr" title="Q: QR-коды таблицы и табло">QR</button>
      <button id="full" aria-label="Во весь экран" title="F: во весь экран">⤢</button>
    </nav>
  </body>
</html>
